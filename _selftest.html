<html lang="vi">
  <head>
    <meta charset="UTF-8" />

  </head>
  <body>
    <pre id="out">running…</pre>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <script src="data/questions.js"></script>

    <script src="js/core/store.js"></script>
    <script src="js/core/firebaseClient.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/sync.js"></script>
    <script src="js/core/classroom.js"></script>
    <script src="js/core/questionBank.js"></script>
    <script src="js/core/exerciseBank.js"></script>
    <script src="js/core/tutorPrompt.js"></script>
    <script src="js/core/tutor.js"></script>
    <script src="js/core/latex.js"></script>
    <script src="js/core/irt.js"></script>
    <script src="js/core/cat.js"></script>
    <script src="js/core/bkt.js"></script>
    <script src="js/core/srs.js"></script>
    <script src="js/core/adaptiveEngine.js"></script>
    <script src="js/core/profiling.js"></script>
    <script src="js/core/treeStability.js"></script>

    <script src="js/views/admin.js"></script>
    <script src="js/views/teacher.js"></script>
    <script src="js/views/classroom.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/onboarding.js"></script>
    <script src="js/views/diagnostic.js"></script>
    <script src="js/views/profile.js"></script>
    <script src="js/views/learningPath.js"></script>
    <script src="js/views/theory.js"></script>
    <script src="js/views/practice.js"></script>
    <script src="js/views/tutor.js"></script>
    <script src="js/views/aiRoadmap.js"></script>
    <script src="js/views/exercises.js"></script>
    <script src="js/views/errors.js"></script>
    <script src="js/views/examples.js"></script>
    <script src="js/router.js"></script>

    <script>
      // Some checks write to localStorage. Snapshot it first and put it back
      // afterwards, so running the suite can never cost a real student their
      // progress — this page is safe to open on the deployed site.
      var SNAPSHOT = {};
      (function () {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          SNAPSHOT[k] = localStorage.getItem(k);
        }
      })();

      function restoreStorage() {
        try {
          localStorage.clear();
          Object.keys(SNAPSHOT).forEach(function (k) {
            localStorage.setItem(k, SNAPSHOT[k]);
          });
        } catch (e) {
          /* nothing more we can do */
        }
      }

      var lines = [];
      var pass = 0;
      var fail = 0;

      var asyncChecks = [];
      function checkAsync(name, fn) { asyncChecks.push([name, fn]); }

      function check(name, fn) {
        try {
          var r = fn();
          if (r === true || r === undefined) {
            pass++;
            lines.push('PASS  ' + name);
          } else {
            fail++;
            lines.push('FAIL  ' + name + '  -> ' + r);
          }
        } catch (e) {
          fail++;
          lines.push('THROW ' + name + '  -> ' + (e && e.message ? e.message : e));
        }
      }

      var AM = window.AM;

      // --- 1. Modules present -------------------------------------------------
      var mods = ['util','const','topics','store','fb','auth','sync','classroom','bank',
                  'latex','irt','cat','bkt','srs','adaptive','profiling','tree',
                  'practiceSelector','path','today','ui','router','views','exercises','tutor','tutorUI','aiRoadmapUI'];
      mods.forEach(function (m) {
        check('module AM.' + m, function () { return AM[m] ? true : 'thiếu'; });
      });

      var views = ['landing','login','admin','teacher','classroom','home','onboarding',
                   'diagnostic','profile','learningPath','theory','practice','errors',
                   'exercises','tutor'];
      views.forEach(function (v) {
        check('view ' + v, function () {
          return typeof AM.views[v] === 'function' ? true : 'không phải hàm';
        });
      });

      // --- 2. Question bank ---------------------------------------------------
      check('bank loaded', function () {
        return AM.bank.isLoaded && AM.bank.QUESTION_BANK.totalCount >= 891
          ? true : 'totalCount=' + AM.bank.QUESTION_BANK.totalCount;
      });
      check('firebase ready', function () {
        return AM.fb.isReady() ? true : 'initError=' + AM.fb.initError();
      });

      // --- 3. IRT -------------------------------------------------------------
      check('IRT P monotonic in theta', function () {
        var item = { a: 1.2, b: 0, c: 0.25 };
        return AM.irt.probabilityCorrect(1, item) > AM.irt.probabilityCorrect(-1, item)
          ? true : 'không tăng theo θ';
      });
      check('IRT all-correct pushes theta up', function () {
        var items = [], resp = [];
        for (var i = 0; i < 10; i++) { items.push({a:1.2,b:0,c:0.25}); resp.push(1); }
        var e = AM.irt.estimateTheta(items, resp);
        return e.theta > 0.5 && isFinite(e.theta) && isFinite(e.standardError)
          ? true : 'theta=' + e.theta + ' se=' + e.standardError;
      });
      check('IRT all-wrong pushes theta down', function () {
        var items = [], resp = [];
        for (var i = 0; i < 10; i++) { items.push({a:1.2,b:0,c:0.25}); resp.push(0); }
        var e = AM.irt.estimateTheta(items, resp);
        return e.theta < -0.5 && isFinite(e.theta) ? true : 'theta=' + e.theta;
      });

      // --- 4. CAT ladder ------------------------------------------------------
      var poolG = AM.bank.getPoolForGrade(8);
      check('pool grade 8 non-empty', function () {
        return poolG.length > 100 ? true : 'len=' + poolG.length;
      });

      var session = {
        sessionId: 'test-session',
        grade: 8,
        selfLevel: 'tb',
        theta: -0.3,
        standardError: 2,
        responses: [],
        shownIds: [],
        sessionStartedAt: Date.now(),
        finished: false,
        stopReason: null,
        topicStates: AM.cat.initTopicStates(poolG, AM.topics.TOPICS, 8)
      };
      var gradeCount = AM.topics.getTopicsByGrade(8).length;
      check('initTopicStates covers grade-8 topics', function () {
        var n = Object.keys(session.topicStates).length;
        return n === gradeCount ? true : 'n=' + n + '/' + gradeCount;
      });

      // Simulate a whole CAT run: answer everything correctly.
      var steps = 0;
      var lastStop = null;
      while (steps < 80) {
        lastStop = AM.cat.shouldStop(session);
        if (lastStop) break;
        var picked = AM.cat.selectNextQuestionWithDebug(poolG, session);
        if (!picked) { lastStop = 'no-more-items'; break; }
        var q = picked.chosen;
        session.responses.push({
          questionId: q.id, startedAt: Date.now() - 30000,
          endedAt: Date.now(), score: 1, answered: true
        });
        session.shownIds.push(q.id);
        session.topicStates[q.topicId] = AM.cat.transitionTopicState(
          session.topicStates[q.topicId], q, true, poolG, new Set(session.shownIds));
        steps++;
      }
      check('CAT run terminates', function () {
        return lastStop !== null ? true : 'không dừng sau ' + steps + ' câu';
      });
      check('CAT covered every topic', function () {
        var seen = {};
        var byId = {};
        poolG.forEach(function (q) { byId[q.id] = q; });
        session.responses.forEach(function (r) { seen[byId[r.questionId].topicId] = 1; });
        var n = Object.keys(seen).length;
        return n === gradeCount
          ? true : 'chỉ phủ ' + n + '/' + gradeCount + ' chủ đề trong ' + steps + ' câu';
      });
      check('CAT no repeated question', function () {
        var s = {};
        for (var i = 0; i < session.shownIds.length; i++) {
          if (s[session.shownIds[i]]) return 'lặp: ' + session.shownIds[i];
          s[session.shownIds[i]] = 1;
        }
        return true;
      });

      // --- 5. Grading ---------------------------------------------------------
      var mcq = poolG.filter(function (q) { return q.type === 'mcq'; })[0];
      check('gradeAnswer mcq correct = 1', function () {
        var correct = mcq.options.filter(function (o) { return o.isCorrect; })[0];
        return AM.cat.gradeAnswer(mcq, correct.label) === 1 ? true : 'sai';
      });
      check('gradeAnswer mcq wrong = 0', function () {
        var wrong = mcq.options.filter(function (o) { return !o.isCorrect; })[0];
        return AM.cat.gradeAnswer(mcq, wrong.label) === 0 ? true : 'sai';
      });
      var tf = poolG.filter(function (q) { return q.type === 'tf'; })[0];
      check('gradeAnswer tf partial', function () {
        if (!tf) return true;
        var all = tf.statements.map(function (s) { return s.isTrue; });
        if (AM.cat.gradeAnswer(tf, all) !== 1) return 'toàn đúng != 1';
        var one = all.slice(); one[0] = !one[0];
        var partial = AM.cat.gradeAnswer(tf, one);
        return partial > 0 && partial < 1 ? true : 'một phần = ' + partial;
      });

      // --- 6. Profiling -------------------------------------------------------
      var profile = {
        grade: 8, goal: 'vao-10', dailyMinutes: 45, deadline: null,
        selfLevel: 'tb', weakTopicIds: ['8-C1-B1'],
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      var est = AM.irt.estimateThetaFromSession(session.responses, function (id) {
        var f = poolG.filter(function (q) { return q.id === id; })[0];
        return f ? f.irt : null;
      }, {});
      session.theta = est.theta;
      session.standardError = est.standardError;
      session.finished = true;
      session.stopReason = lastStop;

      var knowledge = null;
      check('buildKnowledgeProfile runs', function () {
        knowledge = AM.profiling.buildKnowledgeProfile(session, profile, poolG, AM.topics.TOPICS);
        return knowledge && knowledge.topics.length === gradeCount
          ? true : 'topics=' + (knowledge ? knowledge.topics.length : 'null');
      });
      check('mastery in [0,1]', function () {
        for (var i = 0; i < knowledge.topics.length; i++) {
          var m = knowledge.topics[i].mastery;
          if (!(m >= 0 && m <= 1)) return knowledge.topics[i].topicId + ' = ' + m;
        }
        return true;
      });
      check('chapters rolled up', function () {
        return knowledge.chapters.length > 0 ? true : 'rỗng';
      });

      // --- 7. Knowledge tree --------------------------------------------------
      var learner = AM.store.emptyLearnerState();
      var tree = null;
      check('buildKnowledgeTree runs', function () {
        tree = AM.tree.buildKnowledgeTree(knowledge, learner);
        return tree.branches.length > 0 ? true : 'không có nhánh';
      });
      check('stageCounts sums to topic count', function () {
        var sum = 0;
        Object.keys(tree.stageCounts).forEach(function (k) { sum += tree.stageCounts[k]; });
        return sum === gradeCount ? true : 'sum=' + sum;
      });

      // --- 8. Learning path ---------------------------------------------------
      var path = null;
      check('generateLearningPath runs', function () {
        path = AM.path.generateLearningPath(profile, knowledge, poolG, learner);
        return path ? true : 'null';
      });
      check('path days respect daily budget', function () {
        for (var s = 0; s < path.sprints.length; s++) {
          var days = path.sprints[s].days;
          for (var d = 0; d < days.length; d++) {
            if (days[d].estimatedMinutes > profile.dailyMinutes + 15) {
              return 'ngày ' + days[d].dayNumber + ' = ' + days[d].estimatedMinutes + ' phút';
            }
          }
        }
        return true;
      });
      check('path activityIds unique per day', function () {
        for (var s = 0; s < path.sprints.length; s++) {
          for (var d = 0; d < path.sprints[s].days.length; d++) {
            var seen = {};
            var acts = path.sprints[s].days[d].activities;
            for (var a = 0; a < acts.length; a++) {
              if (seen[acts[a].activityId]) return 'trùng ' + acts[a].activityId;
              seen[acts[a].activityId] = 1;
            }
          }
        }
        return true;
      });

      // --- 9. BKT + SRS -------------------------------------------------------
      check('BKT rises on correct', function () {
        var s0 = AM.bkt.initBktState(0.3);
        var s1 = AM.bkt.updateBkt(s0, true);
        return s1.pL > s0.pL ? true : s0.pL + ' -> ' + s1.pL;
      });
      check('BKT reaches mastery after a streak', function () {
        var s = AM.bkt.initBktState(0.3);
        for (var i = 0; i < 12; i++) s = AM.bkt.updateBkt(s, true);
        return AM.bkt.isMastered(s) ? true : 'pL=' + s.pL.toFixed(3);
      });
      check('SRS interval grows', function () {
        var s = AM.srs.initSrsState();
        s = AM.srs.scheduleReview(s, 5);
        var i1 = s.intervalDays;
        s = AM.srs.scheduleReview(s, 5);
        var i2 = s.intervalDays;
        s = AM.srs.scheduleReview(s, 5);
        return (i2 > i1 && s.intervalDays > i2) ? true : i1 + ',' + i2 + ',' + s.intervalDays;
      });
      check('SRS resets on failure', function () {
        var s = AM.srs.initSrsState();
        s = AM.srs.scheduleReview(s, 5);
        s = AM.srs.scheduleReview(s, 5);
        s = AM.srs.scheduleReview(s, 1);
        return s.intervalDays === 1 && s.consecutiveCorrect === 0 ? true : JSON.stringify(s);
      });

      // --- 10. Practice selector ---------------------------------------------
      check('selectPracticeQuestions returns items', function () {
        var sel = AM.practiceSelector.selectPracticeQuestions(
          poolG, '8-C1-B1', ['N','H'], learner, [], 12345);
        return sel.practice.length > 0 ? true : 'practice rỗng';
      });

      // --- 11. LaTeX rendering ------------------------------------------------
      check('latex renders prompts without throwing', function () {
        var bad = 0;
        for (var i = 0; i < 200; i++) {
          var html = AM.latex.toHtml(poolG[i].prompt);
          if (typeof html !== 'string') bad++;
        }
        return bad === 0 ? true : bad + ' câu lỗi';
      });
      check('latex handles math + table', function () {
        var h = AM.latex.toHtml('Cho $x^2+1=0$ và \\begin{tabular}{cc} a & b \\\\ 1 & 2 \\end{tabular}');
        return h.indexOf('kntt-table') !== -1 ? true : 'không có bảng';
      });

      // --- 12. Store round-trip ----------------------------------------------
      check('store save/load profile', function () {
        AM.store.saveProfile(profile);
        var back = AM.store.loadProfile();
        return back && back.grade === 8 && back.goal === 'vao-10' ? true : JSON.stringify(back);
      });
      check('store timestamps recorded', function () {
        var ts = AM.store.getTimestamps();
        return typeof ts.profile === 'number' ? true : JSON.stringify(ts);
      });
      check('store clearAll wipes', function () {
        AM.store.clearAll(true);
        return AM.store.loadProfile() === null ? true : 'vẫn còn';
      });

      // --- 12b. Vietnamese date helpers (onboarding deadline field) ----------
      check('parseDateVN dd/mm/yyyy', function () {
        var r = AM.util.parseDateVN('25/06/2026');
        return r === '2026-06-25' ? true : r;
      });
      check('parseDateVN pads 1-digit day/month, other separators', function () {
        var a = AM.util.parseDateVN('5/6/2026');
        var b = AM.util.parseDateVN('05-06-2026');
        var c = AM.util.parseDateVN('05.06.2026');
        return a === '2026-06-05' && b === a && c === a ? true : a + ',' + b + ',' + c;
      });
      check('parseDateVN rejects impossible dates', function () {
        var bad = ['31/02/2026', '00/01/2026', '12/13/2026', '1/1/26', 'abc', '', '2026-06-25'];
        for (var i = 0; i < bad.length; i++) {
          if (AM.util.parseDateVN(bad[i]) !== null) return 'chấp nhận ' + bad[i];
        }
        return true;
      });
      check('parseDateVN handles leap years', function () {
        return AM.util.parseDateVN('29/02/2028') === '2028-02-29' &&
               AM.util.parseDateVN('29/02/2027') === null ? true : 'sai nhuận';
      });
      check('daysFromTodayVN today = 0, tomorrow = 1', function () {
        var today = AM.util.todayVNStr();
        var t = AM.util.addDays(new Date(today + 'T00:00:00'), 1);
        var tomorrow = t.getFullYear() + '-' +
          String(t.getMonth() + 1).padStart(2, '0') + '-' +
          String(t.getDate()).padStart(2, '0');
        var d0 = AM.util.daysFromTodayVN(today);
        var d1 = AM.util.daysFromTodayVN(tomorrow);
        return d0 === 0 && d1 === 1 ? true : d0 + ',' + d1;
      });

      // --- 12c. Calendar-day helpers must never go through UTC ---------------
      check('dateStr uses the local calendar day', function () {
        var d = new Date('2026-09-09T00:00:00'); // local midnight
        var r = AM.util.dateStr(d);
        return r === '2026-09-09' ? true : r;
      });
      check('addDaysStr crosses month boundaries', function () {
        var a = AM.util.addDaysStr('2026-08-31', 1);
        var b = AM.util.addDaysStr('2026-03-01', -1);
        return a === '2026-09-01' && b === '2026-02-28' ? true : a + ',' + b;
      });
      check('SRS dates are Vietnam calendar days', function () {
        var today = AM.util.todayVNStr();
        var s = AM.srs.initSrsState();
        if (s.nextReviewDate !== AM.util.addDaysStr(today, 1)) return 'init=' + s.nextReviewDate;
        var failed = AM.srs.scheduleReview({ nextReviewDate: today, intervalDays: 6,
          easinessFactor: 2.5, consecutiveCorrect: 3 }, 1);
        return failed.intervalDays === 1 && failed.nextReviewDate === AM.util.addDaysStr(today, 1)
          ? true : JSON.stringify(failed);
      });
      check('learning path day 1 is today', function () {
        for (var s = 0; s < path.sprints.length; s++) {
          var days = path.sprints[s].days;
          if (days.length) {
            return days[0].date === AM.util.todayVNStr()
              ? true : days[0].date + ' != ' + AM.util.todayVNStr();
          }
        }
        return true;
      });
      check('path remembers its diagnostic session', function () {
        return path.diagnosticSessionId === session.sessionId
          ? true : String(path.diagnosticSessionId);
      });

      // --- 12d. Short-answer grading accepts numeric equivalents -------------
      var sa = { type: 'shortans', correctAnswer: '0,5' };
      check('shortans exact / decimal / fraction / spaces', function () {
        var ok = ['0,5', '0.5', ' 0.50 ', '1/2', '.5'].every(function (a) {
          return AM.cat.gradeAnswer(sa, a) === 1;
        });
        return ok ? true : 'một dạng bị từ chối';
      });
      check('shortans still rejects wrong values', function () {
        var bad = ['0.6', '1/3', 'abc', '', '5'];
        for (var i = 0; i < bad.length; i++) {
          if (AM.cat.gradeAnswer(sa, bad[i]) !== 0) return 'chấp nhận ' + bad[i];
        }
        return true;
      });
      check('shortans unicode minus', function () {
        return AM.cat.gradeAnswer({ type: 'shortans', correctAnswer: '-1' }, '\u22121') === 1
          ? true : 'sai';
      });

      // --- 12e. Context flags ------------------------------------------------
      check('unfinished diagnostic does not count as done', function () {
        AM.store.saveProfile(profile);
        AM.store.saveDiagnostic(Object.assign({}, session, { finished: false }));
        var c1 = AM.ui.buildContext();
        AM.store.saveDiagnostic(Object.assign({}, session, { finished: true, grade: 12 }));
        var c2 = AM.ui.buildContext();
        AM.store.saveDiagnostic(session);
        var c3 = AM.ui.buildContext();
        AM.store.clearAll(true);
        return !c1.hasDiagnostic && !c2.hasDiagnostic && c3.hasDiagnostic && c3.knowledge
          ? true : [c1.hasDiagnostic, c2.hasDiagnostic, c3.hasDiagnostic].join(',');
      });
      check('router tolerates a malformed hash', function () {
        var saved = window.location.hash;
        try {
          window.history.replaceState(null, '', '#/theory?topic=%E0%A');
          var parsed = AM.router.parseHash();
          return parsed.path === '/theory' && parsed.params.topic === '%E0%A'
            ? true : JSON.stringify(parsed);
        } finally {
          window.history.replaceState(null, '', saved || '#');
        }
      });


      // --- 12f. Ngân hàng bài tập tự luyện + gợi ý cá nhân hóa ---------------
      var EX = AM.exercises.BANK.items;
      check('exercise bank loaded (≥ 3000 bài)', function () {
        return AM.exercises.isLoaded && EX.length >= 3000 ? true : 'len=' + EX.length;
      });
      check('exercises cover grades 6–9', function () {
        var miss = [6, 7, 8, 9].filter(function (g) { return AM.exercises.forGrade(g).length < 100; });
        return miss.length === 0 ? true : 'thiếu khối ' + miss.join(',');
      });
      check('exercise topic belongs to its own grade', function () {
        for (var i = 0; i < EX.length; i++) {
          var x = EX[i];
          if (!x.t) { if (x.k !== 'exam' && x.k !== 'review') return 'không chủ đề: ' + x.id; continue; }
          var t = AM.topics.getTopicById(x.t);
          if (!t || t.grade !== x.g) return x.id + ' → ' + x.t;
        }
        return true;
      });
      check('every exercise has an image, levels N/H/V/T, keys A–D', function () {
        for (var i = 0; i < EX.length; i++) {
          var x = EX[i];
          if (!x.img || !x.img.length || !/^g[6-9][ab]\/\d{4}/.test(x.img[0][0])) return 'ảnh: ' + x.id;
          if (['N', 'H', 'V', 'T'].indexOf(x.lv) === -1) return 'mức: ' + x.id;
          if (x.ans && !/^[A-D]$/.test(x.ans)) return 'đáp án: ' + x.id;
        }
        return true;
      });
      check('every lesson maps to a known topic', function () {
        var bad = AM.exercises.BANK.lessons.filter(function (l) { return !AM.topics.getTopicById(l.t); });
        return bad.length === 0 ? true : bad.map(function (l) { return l.id; }).join(',');
      });

      var exProfile = { grade: 8, goal: 'cuoi-ky', dailyMinutes: 45, weakTopicIds: [], selfLevel: 'tb' };
      var exLearner = AM.store.loadLearnerState();
      exLearner.bkt['8-C2-B1'] = { pL: 0.15, pT: 0.15, pG: 0.25, pS: 0.1, totalAttempts: 3 };
      var exCtx = { profile: exProfile, learner: exLearner, knowledge: null };
      check('recommend: weakest topic first, right levels', function () {
        var recs = AM.exercises.recommend(exCtx);
        if (!recs.length) return 'rỗng';
        if (recs[0].topic.id !== '8-C2-B1') return 'đầu tiên = ' + recs[0].topic.id;
        var lv = recs[0].levels;
        var ok = recs[0].items.every(function (x) { return lv.indexOf(x.lv) !== -1; });
        return lv.join('') === 'NH' && ok ? true : lv.join('') + ' / ' + recs[0].items.map(function (x) { return x.lv; }).join('');
      });
      check('recommend: stable within a day', function () {
        var a = AM.exercises.recommend(exCtx).map(function (r) { return r.items.map(function (x) { return x.id; }).join(); }).join('|');
        var b = AM.exercises.recommend(exCtx).map(function (r) { return r.items.map(function (x) { return x.id; }).join(); }).join('|');
        return a === b ? true : 'khác nhau';
      });
      check('recommend: finished exercises are not suggested again', function () {
        AM.exercises.forTopic('8-C2-B1').forEach(function (x) { exLearner.exercises[x.id] = { s: 'done', at: 1 }; });
        var recs = AM.exercises.recommend(exCtx);
        var leaked = recs.some(function (r) { return r.topic.id === '8-C2-B1'; });
        exLearner.exercises = {};
        return leaked ? 'vẫn gợi ý chủ đề đã làm hết' : true;
      });
      check('recommend: "chưa làm được" comes back first', function () {
        var target = AM.exercises.forTopic('8-C2-B1')[5];
        exLearner.exercises[target.id] = { s: 'stuck', at: 1 };
        var recs = AM.exercises.recommend(exCtx);
        exLearner.exercises = {};
        return recs[0].items[0].id === target.id ? true : recs[0].items[0].id;
      });
      check('learner.exercises survives save/load', function () {
        var l = AM.store.loadLearnerState();
        l.exercises = { 'g8b-0005': { s: 'done', at: 5, a: 'D' } };
        AM.store.saveLearnerState(l);
        var back = AM.store.loadLearnerState();
        AM.store.clearAll(true);
        return back.exercises['g8b-0005'] && back.exercises['g8b-0005'].a === 'D' ? true : JSON.stringify(back.exercises);
      });

      // --- 12g. Kiểm tra đầu vào theo chương --------------------------------
      check('diagnostic ?chapter=1 starts that chapter only', function () {
        AM.store.saveProfile({ grade: 8, goal: 'cuoi-ky', dailyMinutes: 45, deadline: null,
          selfLevel: 'tb', weakTopicIds: [], createdAt: new Date().toISOString() });
        var c = AM.ui.buildContext();
        var r = AM.views.diagnostic({ chapter: '1' }, c);
        var text = r.node.textContent;
        r.cleanup();
        AM.store.clearAll(true);
        var ch1 = AM.topics.getTopicsByGrade(8).filter(function (t) { return t.chapter === 1; })
          .map(function (t) { return t.chapterTitle; })[0];
        return /Chương 1/.test(text) && text.indexOf(ch1) !== -1 ? true : text.slice(0, 160);
      });
      check('diagnostic intro lists every chapter of the grade', function () {
        AM.store.saveProfile({ grade: 7, goal: 'cuoi-ky', dailyMinutes: 45, deadline: null,
          selfLevel: 'tb', weakTopicIds: [], createdAt: new Date().toISOString() });
        var c = AM.ui.buildContext();
        var r = AM.views.diagnostic({}, c);
        var text = r.node.textContent;
        r.cleanup();
        AM.store.clearAll(true);
        var nos = {};
        AM.topics.getTopicsByGrade(7).forEach(function (t) { nos[t.chapter] = 1; });
        var miss = Object.keys(nos).filter(function (n) { return text.indexOf('Chương ' + n) === -1; });
        return miss.length === 0 ? true : 'thiếu chương ' + miss.join(',');
      });
      check('chapter revision changes the knowledge sessionId (path regenerates)', function () {
        var s1 = Object.assign({}, session, { finished: true, revision: 1 });
        var s2 = Object.assign({}, session, { finished: true, revision: 2 });
        var k1 = AM.profiling.buildKnowledgeProfile(s1, profile, poolG, AM.topics.TOPICS);
        var k2 = AM.profiling.buildKnowledgeProfile(s2, profile, poolG, AM.topics.TOPICS);
        return k1.sessionId !== k2.sessionId ? true : 'trùng';
      });


      // --- 12h. Gia sư AI -----------------------------------------------------
      check('tutor renderRich escapes HTML from the model', function () {
        var h = AM.tutorUI.renderRichHtml('<img src=x onerror=alert(1)> **đậm** <scr' + 'ipt>x</scr' + 'ipt>');
        return h.indexOf('<img') === -1 && h.indexOf('<scr' + 'ipt') === -1 && h.indexOf('<strong>đậm</strong>') !== -1
          ? true : h;
      });
      check('tutor renderRich: LaTeX, lists, display math', function () {
        var h = AM.tutorUI.renderRichHtml('1. Ta có $x^2 - 4 = 0$\n2. Nên\n$$x = \\pm 2$$\n- ý một');
        if (!window.katex) return true; // KaTeX CDN không có thì chỉ kiểm escape
        return /<ol>/.test(h) && /<ul>/.test(h) && (h.match(/class="katex/g) || []).length >= 2 ? true : h.slice(0, 200);
      });
      check('tutor prompt: hint never gives the final answer, answer key hidden', function () {
        var b = AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'hint', context: { grade: 7, answerKey: 'B' },
          messages: [{ role: 'user', text: 'giúp em' }], refImages: [{ mime: 'image/webp', data: 'AAAA' }] });
        var parts = b.contents[0].parts;
        return /grade 7/.test(b.systemInstruction.parts[0].text) &&
          /NEVER give the final answer/.test(parts[parts.length - 1].text) &&
          /never reveal in hint/.test(parts[1].text) && parts[0].inline_data ? true : JSON.stringify(b).slice(0, 200);
      });
      check('tutor prompt: solution mode asks for a similar exercise', function () {
        var b = AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'solution', context: {}, messages: [{ role: 'user', text: 'x' }] });
        return /\*\*Bài tương tự\*\*/.test(b.contents[0].parts[b.contents[0].parts.length - 1].text) ? true : 'thiếu';
      });
      checkAsync('tutor.ask streams deltas from /api/tutor', async function () {
        var realFetch = window.fetch;
        var enc = new TextEncoder();
        window.fetch = async function (url, init) {
          var body = JSON.parse(init.body);
          if (body.mode !== 'hint' || body.imageRefs[0] !== 'g8b/0005.webp') throw new Error('body sai');
          var chunks = ['data: {"t":"Em hãy "}\n\nda', 'ta: {"t":"xét $x$"}\n\n', 'data: {"done":true,"model":"m"}\n\n'];
          return new Response(new ReadableStream({ start: function (c) { chunks.forEach(function (x) { c.enqueue(enc.encode(x)); }); c.close(); } }),
            { headers: { 'content-type': 'text/event-stream' } });
        };
        try {
          var got = '';
          var r = await AM.tutor.ask({ mode: 'hint', context: {}, messages: [{ role: 'user', text: 'a' }], imageRefs: ['g8b/0005.webp'] },
            function (d) { got += d; });
          return got === 'Em hãy xét $x$' && r.text === got && r.model === 'm' ? true : JSON.stringify([got, r]);
        } finally { window.fetch = realFetch; }
      });
      checkAsync('tutor.ask without backend and without key → no-backend error', async function () {
        var realFetch = window.fetch;
        window.fetch = async function () { return new Response('nf', { status: 404, headers: { 'content-type': 'text/html' } }); };
        var saved = AM.tutor.getDevKey();
        AM.tutor.setDevKey('');
        try {
          await AM.tutor.ask({ mode: 'ask', messages: [{ role: 'user', text: 'a' }] }, function () {});
          return 'không ném lỗi';
        } catch (e) {
          return e.code === 'no-backend' ? true : e.message;
        } finally { window.fetch = realFetch; AM.tutor.setDevKey(saved); }
      });
      checkAsync('tutor.ask shows server error message', async function () {
        var realFetch = window.fetch;
        window.fetch = async function () { return new Response(JSON.stringify({ error: 'Cần đăng nhập để dùng Gia sư AI.' }), { status: 401, headers: { 'content-type': 'application/json' } }); };
        try {
          await AM.tutor.ask({ mode: 'ask', messages: [{ role: 'user', text: 'a' }] }, function () {});
          return 'không ném lỗi';
        } catch (e) {
          return /đăng nhập/.test(e.message) ? true : e.message;
        } finally { window.fetch = realFetch; }
      });


      // --- 12i. Gia sư AI: vì sao sai + lộ trình AI --------------------------
      check('explain prompt carries the student answer and asks for an error type', function () {
        var b = AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'explain', context: { studentAnswer: 'B (sai)', answerKey: 'C' },
          messages: [{ role: 'user', text: 'vì sao' }] });
        var parts = b.contents[0].parts;
        return /student_answer: B \(sai\)/.test(parts[0].text) && /Loại lỗi/.test(parts[parts.length - 1].text) ? true : 'thiếu';
      });
      check('sanitizeRoadmap drops unknown topics and respects the daily budget', function () {
        var plan = AM_TUTOR_PROMPT.sanitizeRoadmap({ summary: 's', strengths: ['a'], weaknesses: ['b'], tips: ['c'],
          weeks: [{ week: 1, focus: 'f', goal: 'g', days: [{ day: 1, tasks: [
            { type: 'theory', topicId: '8-C1-B1', minutes: 30, detail: 'x' },
            { type: 'exercise', topicId: '8-C1-B1', minutes: 30, detail: 'y' },
            { type: 'practice', topicId: 'zzz', minutes: 10, detail: 'z' }] }] }] }, ['8-C1-B1'], 45);
        var t = plan.weeks[0].days[0].tasks;
        return t.length === 2 && t[0].minutes + t[1].minutes === 45 ? true : JSON.stringify(t);
      });
      check('buildRoadmapSummary: every topic of the grade, no personal data', function () {
        var ctxR = { profile: { grade: 9, goal: 'vao-10', dailyMinutes: 60, deadline: null, weakTopicIds: [] },
          learner: AM.store.loadLearnerState(), knowledge: null };
        var sm = AM.tutor.buildRoadmapSummary(ctxR, 3);
        var n = AM.topics.getTopicsByGrade(9).length;
        var json = JSON.stringify(sm);
        return sm.topics.length === n && sm.weeks === 3 && sm.dailyMinutes === 60 && json.indexOf('@') === -1
          ? true : sm.topics.length + '/' + n;
      });
      check('AI roadmap card renders a stored plan with links to the right pages', function () {
        var l = AM.store.loadLearnerState();
        var c = { profile: { grade: 8, goal: 'cuoi-ky', dailyMinutes: 45 }, knowledge: { sessionId: 's1' }, learner: Object.assign({}, l, {
          aiRoadmap: { builtAt: new Date().toISOString(), basedOn: 's0', model: 'm', done: { w1d1t0: true }, plan: {
            summary: 'Nhận xét', strengths: ['a'], weaknesses: ['b'], tips: ['c'],
            weeks: [{ week: 1, focus: 'Đơn thức', goal: 'g', days: [{ day: 1, tasks: [
              { type: 'theory', topicId: '8-C1-B1', minutes: 15, detail: 'đọc' },
              { type: 'test', topicId: '8-C3-B1', minutes: 20, detail: 'kiểm tra' }] }] }] } } }) };
        var node = AM.aiRoadmapUI.card(c);
        var hrefs = Array.prototype.map.call(node.querySelectorAll('a'), function (a) { return a.getAttribute('href'); });
        var stale = /Hồ sơ năng lực đã thay đổi/.test(node.textContent);
        return hrefs.indexOf('#/theory?topic=8-C1-B1') !== -1 && hrefs.indexOf('#/diagnostic?chapter=6') !== -1 &&
          /1\/2 nhiệm vụ/.test(node.textContent) && stale ? true : hrefs.join(',') + ' stale=' + stale;
      });
      checkAsync('tutor.roadmap returns the server plan', async function () {
        var realFetch = window.fetch;
        window.fetch = async function (url, init) {
          var body = JSON.parse(init.body);
          if (body.task !== 'roadmap') throw new Error('task sai');
          return new Response(JSON.stringify({ plan: { summary: 'ok', weeks: [] }, model: 'm' }), { headers: { 'content-type': 'application/json' } });
        };
        try {
          var r = await AM.tutor.roadmap({ grade: 8, topics: [] });
          return r.plan.summary === 'ok' ? true : JSON.stringify(r);
        } finally { window.fetch = realFetch; }
      });


      check('error notebook offers "Vì sao em sai?" per wrong answer', function () {
        var q = AM.bank.getPoolForGrade(8)[0];
        var l = Object.assign({}, AM.store.loadLearnerState(), { errors: [{ questionId: q.id, topicId: q.topicId,
          studentAnswer: 'A', correctAnswer: 'C', score: 0, timestamp: new Date().toISOString(), resolved: false }] });
        var node = AM.views.errors({}, { learner: l, profile: null });
        var real = node.node || node;
        var btn = Array.prototype.filter.call(real.querySelectorAll('button'), function (b) { return /Vì sao em sai/.test(b.textContent); });
        return btn.length === 1 ? true : 'số nút = ' + btn.length;
      });


      // --- 12j. Tiết kiệm API ------------------------------------------------
      check('prompt "skill" is short: system instruction under 900 characters', function () {
        var n = AM_TUTOR_PROMPT.systemInstruction({ grade: 8 }).length;
        return n < 900 ? true : 'dài ' + n;
      });
      check('adaptBody: Gemini 3 → thinkingLevel by mode, default temperature', function () {
        var hint = AM_TUTOR_PROMPT.adaptBody(AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'hint', messages: [{ role: 'user', text: 'a' }] }), 'gemini-3.8-flash');
        var sol = AM_TUTOR_PROMPT.adaptBody(AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'solution', messages: [{ role: 'user', text: 'a' }] }), 'gemini-3.8-flash');
        return hint.generationConfig.thinkingConfig.thinkingLevel === 'low' && sol.generationConfig.thinkingConfig.thinkingLevel === 'medium' &&
          hint.generationConfig.temperature === undefined && hint._think === undefined ? true : JSON.stringify([hint.generationConfig, sol.generationConfig]);
      });
      check('images: medium resolution first turn, low on follow-ups; no solution image for hints', function () {
        var img = { mime: 'image/webp', data: 'AA' };
        var a = AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'hint', messages: [{ role: 'user', text: 'a' }], refImages: [img], solImages: [img] });
        var b = AM_TUTOR_PROMPT.buildGeminiBody({ mode: 'hint', messages: [{ role: 'user', text: 'a' }, { role: 'model', text: 'b' }, { role: 'user', text: 'c' }], refImages: [img] });
        var n = a.contents[0].parts.filter(function (p) { return p.inline_data; }).length;
        return a.generationConfig.mediaResolution === 'MEDIA_RESOLUTION_MEDIUM' && b.generationConfig.mediaResolution === 'MEDIA_RESOLUTION_LOW' && n === 1
          ? true : JSON.stringify([a.generationConfig, b.generationConfig, n]);
      });
      check('cache key: same for students in the same level band, absent for typed questions', function () {
        var base = { mode: 'explain', quick: true, messages: [{ role: 'user', text: 'q' }], imageRefs: ['g8b/0005.webp'] };
        var k1 = AM_TUTOR_PROMPT.cacheKeyParts(Object.assign({ context: { studentAnswer: 'A', mastery: 0.32 } }, base));
        var k2 = AM_TUTOR_PROMPT.cacheKeyParts(Object.assign({ context: { studentAnswer: 'A', mastery: 0.50 } }, base));
        var k3 = AM_TUTOR_PROMPT.cacheKeyParts(Object.assign({ context: { studentAnswer: 'B', mastery: 0.50 } }, base));
        var k4 = AM_TUTOR_PROMPT.cacheKeyParts(Object.assign({}, base, { quick: false, context: {} }));
        return k1 && k1 === k2 && k1 !== k3 && k4 === null ? true : [k1, k2, k3, k4].join(' / ');
      });
      checkAsync('tutor.ask: repeated one-tap question answered from this device, no network', async function () {
        var realFetch = window.fetch;
        var calls = 0;
        var enc = new TextEncoder();
        window.fetch = async function () {
          calls++;
          return new Response(new ReadableStream({ start: function (c) { c.enqueue(enc.encode('data: {"t":"Gợi ý A"}\n\ndata: {"done":true}\n\n')); c.close(); } }),
            { headers: { 'content-type': 'text/event-stream' } });
        };
        var req = { mode: 'hint', quick: true, context: { grade: 8, label: 'Câu 9' }, messages: [{ role: 'user', text: 'q' }], imageRefs: ['g8b/0099.webp'] };
        try {
          var a = await AM.tutor.ask(req, function () {});
          var got = '';
          var b = await AM.tutor.ask(req, function (d) { got += d; });
          return calls === 1 && b.cached && got === 'Gợi ý A' && a.text === 'Gợi ý A' ? true : JSON.stringify([calls, b]);
        } finally { window.fetch = realFetch; }
      });

      // --- 13. Views render ---------------------------------------------------
      var ctx = AM.ui.buildContext();
      views.forEach(function (v) {
        check('render view ' + v, function () {
          var node = AM.views[v]({}, ctx);
          var real = node && node.node ? node.node : node;
          if (node && node.cleanup) node.cleanup();
          return real && real.nodeType === 1 ? true : 'không trả về element';
        });
      });

      // --- Report (sau khi chạy xong các phép kiểm bất đồng bộ) ----------------
      (async function () {
        for (var i = 0; i < asyncChecks.length; i++) {
          var name = asyncChecks[i][0];
          try {
            var r = await asyncChecks[i][1]();
            if (r === true || r === undefined) { pass++; lines.push('PASS  ' + name); }
            else { fail++; lines.push('FAIL  ' + name + '  -> ' + r); }
          } catch (e) {
            fail++;
            lines.push('THROW ' + name + '  -> ' + (e && e.message ? e.message : e));
          }
        }
        restoreStorage();
        lines.unshift('==== ' + pass + ' PASS / ' + fail + ' FAIL ====');
        document.getElementById('out').textContent = lines.join('\n');
        document.title = fail === 0 ? 'ALL PASS' : fail + ' FAIL';
      })();
    </script>
  </body>
</html>
